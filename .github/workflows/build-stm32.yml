name: Build STM32F103CBT6 (ST HEX & BIN)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM GCC toolchain and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi make

      - name: Compile FlightController (HEX and BIN)
        run: |
          make -C FlightController_ST clean
          make -C FlightController_ST -j$(nproc)
          ls -la FlightController_ST/build

      - name: Upload HEX and BIN firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlightController-ST-HEX-BIN
          path: |
            FlightController_ST/build/*.hex
            FlightController_ST/build/*.bin
          if-no-files-found: error
